name: Estacionalidad (recorrido por día de la semana y por mes)

# Baja ~20 años de velas diarias y publica `estado/estacionalidad.json` en la
# rama `datos`. La app lo lee de ahí.
#
# Ver la cabecera de `app/src/lib/estacionalidad.js` para lo que de verdad
# decide esta función: son DOS preguntas con muestras completamente distintas.
# «¿cuánto se movió el par en octubre?» sale de ~420 días y se puede leer;
# «¿cuántos octubres cerraron en verde?» sale de 20 observaciones y su margen
# es de ±22 puntos, o sea que no decide nada. Las dos se publican, cada una con
# su margen pegado, y el contraste entre ellas es el que enseña la lección.
#
# ⚠️⚠️ ESTO SÍ GASTA CRÉDITOS DE TWELVE DATA: **14 de los 800 del día**, los 14
# pares en dos tandas de 7. Gasto total de Swing al día:
# 14 (vigía) + 28 (publicar el barrido, 2 corridas) + 7 (reporte) + 15 (oro) +
# 14 (esto) = **78 de 800**.
#
# 📌 Y pedir VEINTE AÑOS no cuesta más que pedir uno: el crédito se paga por
# petición, no por vela. Una petición de 5.000 velas y una de 300 valen lo
# mismo, así que la historia larga sale gratis — lo único que cambia es que la
# tabla mensual pasa de no tener sentido a tener su margen honesto.
#
# ⚠️ Y POR ESO NECESITA EL SECRETO. Sin el `env` de abajo, `leerLlave` no
# encuentra la llave y el guion falla. Cualquier workflow nuevo que llame a
# estos guiones tiene que pasarle el secreto.

on:
  schedule:
    # 08:41 UTC, de lunes a viernes.
    #
    # LA HORA: 51 minutos después del oro (07:50) y a más de dos horas y media
    # del publicador del barrido (11:20). Esa distancia es lo que importa: el
    # plan gratuito da 8 créditos POR MINUTO, así que dos guiones pidiendo
    # velas a la vez se estorbarían con 429 y ninguno daría un error claro.
    # Ya pasó el 2026-10-07, cuando el reloj de fuera empezó a disparar
    # puntual y cuatro programas coincidieron en el mismo minuto: el que murió
    # fue el vigía, que es el que escribe el historial.
    #
    # EL MINUTO 41: es el que le toca en la lista del reloj de fuera, tres
    # minutos después del oro (:38). Los que piden precios van separados de
    # tres en tres a propósito, porque cada guion pide 7 símbolos de golpe.
    #
    # LOS DÍAS: de lunes a viernes. En fin de semana no hay velas nuevas, así
    # que correr sábado y domingo gastaría 28 créditos a la semana para volver
    # a calcular lo mismo.
    #
    # ⚠️ Y A DIARIO aunque el dato se mueva una vela al día, por el mismo
    # motivo que el COT: el reloj de GitHub se salta corridas —el vigía de
    # Swing perdió el viernes 5 de septiembre entero— y una cadencia semanal
    # convertiría un salto en una semana sin datos. Correr de más cuesta 14
    # créditos de 800; saltarse de más deja la tarjeta con el dato de la semana
    # pasada.
    - cron: '41 8 * * 1-5'
  workflow_dispatch:

# Escribe en la rama `datos`: por defecto el token de Actions es de solo
# lectura.
permissions:
  contents: write

concurrency:
  group: estacionalidad
  cancel-in-progress: false

jobs:
  estacionalidad:
    runs-on: ubuntu-latest
    # Sin esto GitHub deja correr un trabajo hasta SEIS HORAS, y con
    # `concurrency` sin cancelar una corrida atascada bloquearía las siguientes
    # media jornada.
    #
    # Lo normal aquí son ~1,5 minutos: la primera tanda de 7 pares, 65 s de
    # pausa para no rozar el límite de créditos por minuto, y la segunda.
    timeout-minutes: 10
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Traer los datos
        uses: actions/checkout@v4
        with:
          ref: datos
          path: datos

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No hace falta `npm ci`: el publicador solo usa `node:fs` y funciones
      # puras de `src/lib/`.
      - name: Bajar y calcular
        working-directory: app
        env:
          # ⚠️ SIN ESTO EL GUION FALLA. Ver la cabecera.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VIGIA_DATOS: ${{ github.workspace }}/datos
        run: node scripts/publicar-estacionalidad.mjs

      - name: Guardar
        working-directory: datos
        run: |
          git config user.name 'Estacionalidad Nestor Forex Swing'
          git config user.email 'noreply@anthropic.com'
          git add estado/estacionalidad.json
          # ⚠️ AQUÍ «no cambió nada» SÍ ES SOSPECHOSO, al revés que en el COT.
          #
          # Allí el informe es semanal y seis días de cada siete no cambia nada.
          # Aquí el archivo lleva `generadoEl`, que cambia en CADA corrida, así
          # que un diff vacío solo puede significar que el guion no escribió —
          # y eso no puede pasar en silencio.
          if git diff --cached --quiet; then
            echo '✗ El archivo de estacionalidad no cambió, y `generadoEl` debería cambiar siempre.'
            echo '  Eso significa que el guion no escribió nada. Mirar el paso anterior.'
            exit 1
          fi
          git commit -m "Estacionalidad $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin datos && git push origin HEAD:datos && exit 0
            sleep $((i * 5))
          done
          echo 'No se pudo guardar tras 3 intentos.'
          exit 1
