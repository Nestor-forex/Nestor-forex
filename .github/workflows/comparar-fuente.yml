name: Comparar fuente de datos

# Mide qué cambiaría al pasar de los cierres del BCE a las velas diarias
# reales de Twelve Data. NO cambia nada: solo imprime números.
#
# Corre aquí y no en el entorno de la sesión de Claude porque ese tiene
# bloqueado api.twelvedata.com. Solo a mano.

on:
  workflow_dispatch:

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparar
        working-directory: app
        env:
          # Si el secreto no está puesto todavía, velas.mjs se cae a la llave
          # de .env.production y todo sigue igual. Ver el comentario de
          # `leerLlave` para el orden de los dos pasos.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: node scripts/comparar-fuente.mjs
