name: Medir si el COT sirve como filtro

# Mide si las posiciones del COT habrían servido para descartar las señales
# malas de la app. Ver la cabecera de `app/scripts/medir-cot.mjs`.
#
# DOS FAMILIAS Y DOS LISTONES, desde el 2026-11-02:
#
#   · **los fondos** (`lev_money`, hedge funds) — listón del 2026-09-14 en
#     `app/scripts/lib/preregistro-cot.mjs`. Ya se midió y SUSPENDIÓ;
#   · **los pequeños** (`nonrept`, los que no declaran) — listón del 2026-11-02
#     en `app/scripts/lib/preregistro-cot-pequenos.mjs`. Es la pregunta de
#     «los pequeños pierden, hagamos lo contrario», que nunca se había medido.
#
# ⚠️⚠️ `nonrept` NO ES EL SENTIMIENTO MINORISTA DE UN BRÓKER DE FOREX: un solo
# contrato de euro del CME son 125.000 €. Es un parecido con cinco años de
# historia, y su aprobado no diría nada sobre el dato de verdad.
#
# ⚠️ ES UNA MEDICIÓN, NO UN CAMBIO. No toca ni una línea de `app/src/` y no
# enciende nada.
#
# 📌 Antes de gastar los créditos, la plomería se prueba sin red ni llave:
# `node scripts/humo-cot-pequenos.mjs` corre ESTE guion con dobles de las dos
# puertas que salen a internet.
#
# ⚠️⚠️ SÍ GASTA CRÉDITOS DE TWELVE DATA: 14, por las velas. Por eso lleva el
# secreto y por eso NO está programado — se lanza a mano cuando hace falta.
# (El historial del COT es gratis: es la API pública de la CFTC.)
#
# 📌 El `env` de abajo no es opcional. El 2026-09-03, al sacar la llave de los
# archivos, apareció que `comparar-reglas.yml` se había quedado sin él y habría
# fallado la próxima vez que alguien lo lanzara, sin explicación.

on:
  workflow_dispatch:
    inputs:
      velas:
        description: 'Cuántas velas diarias descargar (1500 ≈ 6 años)'
        required: false
        default: '1500'

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    # Las velas van en dos tandas con una pausa de 65 s en medio (el plan
    # gratuito da 8 créditos por minuto), y después hay que recorrer ~1.400
    # días generando el barrido de cada uno. Sin esto GitHub dejaría correr un
    # trabajo atascado hasta seis horas.
    timeout-minutes: 30
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Medir
        working-directory: app
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VELAS: ${{ inputs.velas }}
        run: node scripts/medir-cot.mjs
