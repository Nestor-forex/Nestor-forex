name: Sonda del calendario económico

# Averigua qué fuente de calendario económico responde de verdad y qué forma
# tienen sus datos. Ver la cabecera de app/scripts/sonda-calendario.mjs.
#
# EXISTE PORQUE la red de las sesiones donde se programa esta app bloquea esos
# servidores, así que desde ahí no se puede ver ni si responden. Escribir el
# lector a ciegas y descubrirlo con la app publicada es al revés de como se
# trabaja aquí: primero se mira, después se escribe.
#
# ⚠️ NO gasta créditos de Twelve Data ni necesita ningún secreto: son feeds
# públicos. Por eso este workflow no lleva bloque `env`.
#
# Solo a mano. No tiene sentido programarlo: se lanza cuando hay que decidir.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    # Cuatro peticiones con 25 s de tope cada una. Si tarda más de 5 minutos es
    # que algo se colgó, y sin esto GitHub lo dejaría correr seis horas.
    timeout-minutes: 5
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No hace falta `npm ci`: la sonda solo usa `fetch`, que ya viene en Node.
      - name: Sondear
        working-directory: app
        run: node scripts/sonda-calendario.mjs
