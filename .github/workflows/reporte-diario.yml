name: Reporte diario del barrido

on:
  schedule:
    - cron: '30 15 * * 1-5' # 10:30 a.m. hora de Colombia (UTC-5), lunes a viernes — después de que el BCE publica el cierre del día
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar reporte
        working-directory: app
        run: node scripts/reporte-diario.mjs
