name: Banco de pruebas de las reglas

# Corre las reglas del barrido sobre los últimos ~300 días reales y dice
# cuánto habrían acertado, comparando varias variantes de los filtros.
#
# NO cambia nada ni publica nada: solo imprime números. Está para decidir con
# medidas en vez de con intuición — ninguna regla debería entrar a la app sin
# haber pasado por aquí.
#
# Corre en Actions y no en el entorno de la sesión de Claude porque ese tiene
# bloqueado api.twelvedata.com. Solo a mano.

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Más generoso que los otros: las velas llegan en dos tandas con una pausa
    # de 65 s en medio (el plan gratuito da 8 consultas por minuto), y encima
    # hay que recalcular el barrido entero una vez por día medido.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Primero lo que no necesita internet: si el motor está roto, mejor
      # saberlo antes de gastar 14 créditos de la cuota diaria.
      #
      # El lint va el primero de todos y no es un adorno. `backtest.mjs` corre
      # sin compilador, así que un import que falta no se nota hasta que el
      # script ya va por la mitad: pasó de verdad —faltaba importar
      # `simetrica`— y el fallo apareció DESPUÉS de descargar los precios, con
      # la cuota ya gastada y sin resultados. `no-undef` lo caza en un segundo.
      - name: Comprobar que no falta ningún import
        working-directory: app
        run: npm install --silent && npm run lint
      # Todas las comprobaciones que NO necesitan internet van antes de la
      # descarga, por la misma razón que el linter de arriba: si algo está
      # roto, es mucho mejor enterarse en dos segundos y gratis que después de
      # gastar los créditos del día.
      - name: Comprobar el motor del banco de pruebas
        working-directory: app
        run: node scripts/prueba-backtest.mjs
      - name: Comprobar los indicadores contra la referencia
        working-directory: app
        run: node scripts/prueba-indicadores.mjs
      - name: Comprobar el modelo de costes
        working-directory: app
        run: node scripts/prueba-costes.mjs
      - name: Comprobar el barrido de liquidez
        working-directory: app
        run: node scripts/prueba-barrido-liquidez.mjs

      - name: Medir
        working-directory: app
        env:
          # Si el secreto no está puesto todavía, velas.mjs se cae a la llave
          # de .env.production y todo sigue igual. Ver el comentario de
          # `leerLlave` para el orden de los dos pasos.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: node scripts/backtest.mjs
