name: Vigía diario

# Revisa el barrido una vez al día y anota las señales nuevas. Ver el
# comentario de cabecera de app/scripts/vigia.mjs para el porqué.
#
# UNA VEZ AL DÍA, no cada hora como en la app hermana de intradía: aquí cada
# vela ES un día, así que pedir precios cada hora sería pedir veinticuatro
# veces lo mismo — y gastar veinticuatro veces los créditos de Twelve Data.
#
# Los datos NO se guardan en esta rama: van a la rama `datos`, para que el
# historial del código no quede sepultado bajo un commit diario.

on:
  schedule:
    # 15:50 UTC de lunes a viernes: el reporte diario sale a las 15:40, así que
    # este va justo después y no se pisan.
    #
    # ⚠️ La hora se eligió cuando los precios venían del BCE (publicaba a eso de
    # las 16:00 CET). Desde el 2026-08-09 son velas diarias de Twelve Data, que
    # cierran a las 22:00 UTC, así que este vigía ve la vela del día ANTERIOR ya
    # cerrada más la de hoy a medias. Es lo correcto para no juzgar con una vela
    # sin terminar — pero el motivo ya no es el que decía este comentario.
    #
    # ⚠️ TRES INTENTOS, NO TRES CORRIDAS (desde el 2026-09-07).
    #
    # El reloj de GitHub es impuntual y se salta corridas enteras: el viernes 5
    # de septiembre de 2026 el vigía NO CORRIÓ, y ese día de historial se perdió
    # para siempre —el historial vale porque registra lo que la app dijo ESE
    # día, así que rellenarlo después sería inventarlo—. El día 4 llegó con 2
    # horas y 43 minutos de retraso.
    #
    # Así que se intenta tres veces con media hora de separación. `vigia.mjs`
    # mira antes si ya corrió hoy y, si sí, se sale sin pedir precios: en un día
    # normal solo trabaja el primero y los otros dos tardan un segundo y no
    # gastan ni un crédito. Sigue siendo UNA corrida al día.
    #
    # Y `concurrency` de abajo evita lo único que podría estropearlo: que un
    # intento retrasado se solape con el siguiente y los dos anoten lo mismo.
    - cron: '50 15 * * 1-5'
    - cron: '20 16 * * 1-5'
    - cron: '50 16 * * 1-5'
  workflow_dispatch:
    inputs:
      # ⚠️ La casilla es la EXCEPCIÓN, no el funcionamiento normal, y el motivo
      # cambió el 2026-11-01: **el reloj de Cloudflare pulsa por aquí**, con un
      # `dispatches` que no manda ningún input. Antes el guardián se ponía solo
      # cuando el disparo era `schedule`, así que el pulso del reloj corría
      # SIEMPRE sin guardián — y el día que el reloj pulsara dos veces, el
      # vigía anotaría señales nuevas con la misma fecha y partiría el
      # historial en dos, que es lo único irrecuperable del proyecto.
      #
      # Con el guardián puesto por defecto no cambia nada en el día a día (el
      # reloj pulsa una vez y `yaCorrioHoy` lo deja pasar), y se gana que un
      # pulso de más no cueste nada. Mismo patrón que `publicar-barrido.yml`.
      forzar:
        description: 'Correr aunque hoy ya haya corrido (para recuperar un día que se saltó)'
        type: boolean
        default: false

# El vigía escribe en la rama `datos`, así que necesita permiso de escritura:
# por defecto el token de Actions es de solo lectura.
permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    # Red de seguridad: por defecto GitHub deja correr un trabajo seis horas, y
    # como `concurrency` no cancela la corrida anterior, una atascada dejaría
    # al vigía sin vigilar días enteros. Lo normal son unos segundos.
    timeout-minutes: 10
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Traer los datos
        uses: actions/checkout@v4
        with:
          ref: datos
          path: datos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Revisar
        working-directory: app
        env:
          VIGIA_DATOS: ${{ github.workspace }}/datos
          # Si estos dos secretos no están puestos, el vigía sigue funcionando
          # igual y solo anota que no pudo avisar: lo que no se puede perder es
          # el historial de señales.
          # La llave de Twelve Data. Si el secreto no está puesto todavía,
          # velas.mjs se cae a la de .env.production y todo sigue igual.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # El guardián de los tres intentos: si hoy ya corrió, este intento se
          # sale sin pedir precios. Va PUESTO por defecto, también para los
          # pulsos del reloj de Cloudflare, que llegan por `workflow_dispatch`
          # y sin inputs — ver el porqué arriba, en la casilla `forzar`.
          #
          # ⚠️ `'0' || '1'` y no `'' || '1'`: una cadena vacía es FALSA en las
          # expresiones de GitHub, así que con `''` marcar «forzar» no forzaría
          # nada, en silencio. Mismo cuidado que en `publicar-barrido.yml`.
          VIGIA_SOLO_SI_FALTA: ${{ inputs.forzar && '0' || '1' }}
        run: node scripts/vigia.mjs

      - name: Guardar lo que vio
        working-directory: datos
        run: |
          git config user.name 'Vigía Nestor Forex Swing'
          git config user.email 'noreply@anthropic.com'
          git add estado historial
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m "Vigía $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin datos && git push origin HEAD:datos && exit 0
            sleep $((i * 5))
          done
          echo 'No se pudo guardar tras 3 intentos.'
          exit 1
